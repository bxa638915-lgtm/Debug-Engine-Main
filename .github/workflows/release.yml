name: Create Release Builds

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v1.1.0 or v1.2.0-beta.1)"
        required: true
      prerelease:
        description: "Is this a prerelease?"
        required: true
        type: boolean
      assets_epoch:
        description: "Assets Epoch generation (bump when asset structures change)"
        required: false
        default: "1"
      breaking:
        description: "Is this a breaking changes update?"
        required: false
        type: boolean
        default: false
      custom_message:
        description: "Optional pre-changelog message"
        required: false

jobs:
  collect-release:
    name: Release ${{ github.event.inputs.tag_name }} Builds
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setting up Haxe
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: 4.3.7

      # ---------------- Windows ----------------
      - name: Download Windows Full Build
        uses: dawidd6/action-download-artifact@v24
        with:
          workflow: windows.yml
          name: Codename Engine
          path: artifacts/windows/full_build
          allow_forks: false

      - name: Download Windows Launcher
        uses: dawidd6/action-download-artifact@v24
        continue-on-error: true
        with:
          workflow: windows.yml
          name: DBE Launcher (Windows)
          path: artifacts/windows/launcher
          allow_forks: false

      # ---------------- Mac OS ----------------
      - name: Download Mac OS Full Build
        uses: dawidd6/action-download-artifact@v24
        with:
          workflow: macos.yml
          name: Codename Engine-x64
          path: artifacts/macos/full_build
          allow_forks: false

      - name: Download Mac OS Launcher
        uses: dawidd6/action-download-artifact@v24
        continue-on-error: true
        with:
          workflow: macos.yml
          name: DBE Launcher (Mac)
          path: artifacts/macos/launcher
          allow_forks: false

      # ---------------- Linux ----------------
      - name: Download Linux Full Build
        uses: dawidd6/action-download-artifact@v24
        with:
          workflow: linux.yml
          name: Codename Engine
          path: artifacts/linux/full_build
          allow_forks: false

      - name: Download Linux Launcher
        uses: dawidd6/action-download-artifact@v24
        continue-on-error: true
        with:
          workflow: linux.yml
          name: DBE Launcher (Linux)
          path: artifacts/linux/launcher
          allow_forks: false

      # ---------------- Untar Mac if needed ----------------
      - name: Prepare Mac files
        run: |
          if [ -f artifacts/macos/full_build/CodenameEngine.tar.gz ]; then
            mkdir -p artifacts/macos/extracted
            tar -zxvf artifacts/macos/full_build/CodenameEngine.tar.gz -C artifacts/macos/extracted
            rm -rf artifacts/macos/full_build
            mv artifacts/macos/extracted artifacts/macos/full_build
          fi

      # ---------------- Check for Previous Manifests ----------------
      - name: Fetch previous release manifest
        id: prev_manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p prev_manifests
          LATEST_TAG=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName -q '.[0].tagName' || echo "")
          if [ -n "$LATEST_TAG" ]; then
            echo "Latest release: $LATEST_TAG. Attempting to download previous manifests..."
            gh release download "$LATEST_TAG" --repo ${{ github.repository }} --pattern "manifest-*.json" -D prev_manifests || true
          fi

      # ---------------- Run PackTool to generate Delta Manifests & Packages ----------------
      - name: Package Engine & Generate Manifests
        run: |
          mkdir -p dist

          PREV_WIN=""
          [ -f prev_manifests/manifest-windows.json ] && PREV_WIN="--previous prev_manifests/manifest-windows.json"
          PREV_LIN=""
          [ -f prev_manifests/manifest-linux.json ] && PREV_LIN="--previous prev_manifests/manifest-linux.json"
          PREV_MAC=""
          [ -f prev_manifests/manifest-macos.json ] && PREV_MAC="--previous prev_manifests/manifest-macos.json"

          # Windows
          haxe -cp launcher/source --run dbe.launcher.tools.PackTool \
            --dir artifacts/windows/full_build \
            --tag ${{ github.event.inputs.tag_name }} \
            --platform windows \
            --epoch ${{ github.event.inputs.assets_epoch || '1' }} \
            --breaking ${{ github.event.inputs.breaking || 'false' }} \
            --exe CodenameEngine.exe \
            --out dist/ $PREV_WIN

          # Linux
          haxe -cp launcher/source --run dbe.launcher.tools.PackTool \
            --dir artifacts/linux/full_build \
            --tag ${{ github.event.inputs.tag_name }} \
            --platform linux \
            --epoch ${{ github.event.inputs.assets_epoch || '1' }} \
            --breaking ${{ github.event.inputs.breaking || 'false' }} \
            --exe CodenameEngine \
            --out dist/ $PREV_LIN

          # Mac OS
          haxe -cp launcher/source --run dbe.launcher.tools.PackTool \
            --dir artifacts/macos/full_build \
            --tag ${{ github.event.inputs.tag_name }} \
            --platform macos \
            --epoch ${{ github.event.inputs.assets_epoch || '1' }} \
            --breaking ${{ github.event.inputs.breaking || 'false' }} \
            --exe CodenameEngine \
            --out dist/ $PREV_MAC

      # ---------------- Package Launchers ----------------
      - name: Package Launchers
        run: |
          # Windows Launcher
          if [ -d artifacts/windows/launcher ]; then
            cd artifacts/windows/launcher
            zip -r ../../../dist/DBE-Launcher-windows.zip *
            cd -
          fi

          # Linux Launcher
          if [ -d artifacts/linux/launcher ]; then
            cd artifacts/linux/launcher
            zip -r ../../../dist/DBE-Launcher-linux.zip *
            cd -
          fi

          # Mac OS Launcher
          if [ -d artifacts/macos/launcher ]; then
            cd artifacts/macos/launcher
            zip -r ../../../dist/DBE-Launcher-macos.zip *
            cd -
          fi

      # ---------------- Changelog Message ----------------
      - name: Prepare changelog message
        id: changelog_message
        run: |
          BODY=""
          if [ -n "${{ github.event.inputs.custom_message }}" ]; then
            BODY="${{ github.event.inputs.custom_message }}\n\n"
          fi
          BODY="${BODY}### Atualizacao com DBE Launcher\nPara atualizar automaticamente preservando sua pasta \`mods/\`, abra o **DBE Launcher** e clique em **Atualizar**.\n"
          {
            echo "body<<EOF"
            echo -e "$BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      # ---------------- Publish GitHub Release ----------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: Release ${{ github.event.inputs.tag_name }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease }}
          body: ${{ steps.changelog_message.outputs.body }}
          generate_release_notes: true
          files: |
            dist/DBE-windows.zip
            dist/manifest-windows.json
            dist/DBE-Launcher-windows.zip
            dist/DBE-linux.zip
            dist/manifest-linux.json
            dist/DBE-Launcher-linux.zip
            dist/DBE-macos.zip
            dist/manifest-macos.json
            dist/DBE-Launcher-macos.zip
